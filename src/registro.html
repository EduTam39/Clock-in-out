<!DOCTYPE html>
<html>
    <head>
        <title>Registro</title>
        <link rel="icon" type="image/png" href="registoads_logo.png">
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    </head>
    <body>
        <div align="center">
            <img src="registoads_logo.png" alt="registoad" width="100" height="93"> 
            <h1>Registro</h1><br>
            <form action="register.php" method="post" align="center">
                <div class="form-group">
                    <div class="form-group mango">
                        <label for="username">Usuario:</label>
                        <div class="input-group">
                            <input type="text" id="username" name="user" placeholder="Usuario" required><br><br>
                        </div>
                    </div>
                    <div class="form-group mango">
                        <label for="email">Correo electrónico:</label>
                        <div class="input-group">
                            <input type="email" id="email" name="email" placeholder="Correo@ejemplo.com" required><br><br>
                        </div>
                    </div>
                    <div class="form-group mango">
                        <label for="password">Contraseña:</label>
                        <div class="input-group">
                            <input type="password" id="password" name="passwd" placeholder="Contraseña" required><br><br>
                        </div>
                    </div>
                    <input type="submit" value="Registrarse">
                </div>
                
            </form>
        </div>
    </body>
</html>
